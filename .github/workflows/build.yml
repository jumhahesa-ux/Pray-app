name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Get dependencies
        working-directory: pray_app
        run: flutter pub get
      - name: Build APK
        working-directory: pray_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pray-app-apk
          path: pray_app/build/app/outputs/flutter-apk/app-release.apk
