name: pray_app
description: "ئەپی نوێژ - فێربوونی نوێژ و زانیاری ئیسلامی بەپێی مەزهەبی شافیعی"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
#  geolocator: ^14.0.2
  flutter_compass: ^0.8.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A3D28"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
